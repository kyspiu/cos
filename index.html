<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mówik</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a9c4a3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="container">
        <header class="sentence-composer" aria-label="Dodaj zdanie">
            <div class="app-heading">
                <div>
                    <p class="eyebrow">Mówik</p>
                    <h1>Twoje zdania</h1>
                </div>
                <span class="app-mark" aria-hidden="true">✦</span>
            </div>
            <div class="sentence-input-row" id="speechDisplay">
                <input id="sentenceInput" type="text" maxlength="80" placeholder="dodaj zdanie" aria-label="Dodaj zdanie do listy" />
                <button id="btnAddSentence" class="composer-button add-button" type="button" aria-label="Dodaj zdanie">✓</button>
            </div>
        </header>

        <section class="quick-responses" aria-label="Szybkie odpowiedzi">
            <div class="quick-response" data-response="yes">
                <button class="quick-response-play yes" type="button" aria-label="Odtwórz TAK">TAK</button>
                <button class="quick-response-record" type="button" aria-label="Nagraj TAK">Nagraj</button>
                <span class="quick-response-status" aria-live="polite"></span>
            </div>
            <div class="quick-response" data-response="no">
                <button class="quick-response-play no" type="button" aria-label="Odtwórz NIE">NIE</button>
                <button class="quick-response-record" type="button" aria-label="Nagraj NIE">Nagraj</button>
                <span class="quick-response-status" aria-live="polite"></span>
            </div>
        </section>

        <main>
            <div class="list-heading">
                <h2>Lista zdań</h2>
                <span id="sentenceCount" class="sentence-count" aria-live="polite"></span>
            </div>
            <div class="sentence-list" id="sentenceList" aria-live="polite"></div>
            <p id="appStatus" class="app-status" role="status" aria-live="polite"></p>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
