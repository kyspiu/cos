<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mówik</title>
    <link rel="icon" href="icon.png" type="image/x-icon">
    <link rel="stylesheet" href="style.css?v=20">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#a9c4a3">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>
    <div class="container">
        <header>
            <div class="speech-display" id="speechDisplay" aria-live="polite">—</div>
            <div class="category-path" id="categoryPath">Kategorie główne</div>
        </header>

        <main>
            <div class="grid" id="grid"></div>
            <dialog class="category-dialog" id="categoryDialog">
                <form id="categoryForm">
                    <h2>Nowa kategoria</h2>
                    <label>
                        Nazwa
                        <input id="categoryName" type="text" maxlength="32" placeholder="np. JEDZENIE" required>
                    </label>
                    <label>
                        Emoji
                        <input id="categoryEmoji" type="text" maxlength="4" placeholder="📁">
                    </label>
                    <label>
                        Kolor
                        <input id="categoryColor" type="hidden" value="#86b88a">
                        <div class="color-palette" id="categoryPalette" aria-label="Wybierz kolor kategorii"></div>
                    </label>
                    <label class="checkbox-label">
                        <input id="categorySpeak" type="checkbox" checked>
                        Czytaj tę kategorię w POWIEDZ
                    </label>
                    <div class="dialog-actions">
                        <button class="dialog-cancel" id="btnCancelCategory" type="button">ANULUJ</button>
                        <button class="add-btn" type="submit">DODAJ</button>
                    </div>
                    <p class="form-message" id="categoryMessage" role="status" aria-live="polite"></p>
                </form>
            </dialog>
            <dialog class="category-dialog" id="wordDialog">
                <form id="wordForm">
                    <h2>Nowe słowo</h2>
                    <label>
                        Słowo lub fraza
                        <input id="wordName" type="text" maxlength="64" placeholder="np. JESTEM GŁODNY" required>
                    </label>
                    <label>
                        Emoji
                        <input id="wordEmoji" type="text" maxlength="4" placeholder="💬">
                    </label>
                    <label>
                        Kolor
                        <input id="wordColor" type="hidden" value="#86b88a">
                        <div class="color-palette" id="wordPalette" aria-label="Wybierz kolor słowa"></div>
                    </label>
                    <div class="dialog-actions">
                        <button class="dialog-cancel" id="btnCancelWord" type="button">ANULUJ</button>
                        <button class="add-btn" type="submit">DODAJ</button>
                    </div>
                    <p class="form-message" id="wordMessage" role="status" aria-live="polite"></p>
                </form>
            </dialog>
            <dialog class="category-dialog" id="editDialog">
                <form id="editForm">
                    <h2>Edytuj element</h2>
                    <label>
                        Nazwa
                        <input id="editName" type="text" maxlength="64" required>
                    </label>
                    <label>
                        Emoji
                        <input id="editEmoji" type="text" maxlength="4">
                    </label>
                    <label>
                        Kolor
                        <input id="editColor" type="hidden">
                        <div class="color-palette" id="editPalette" aria-label="Wybierz kolor"></div>
                    </label>
                    <label class="checkbox-label" id="editSpeakRow">
                        <input id="editSpeak" type="checkbox">
                        Czytaj w POWIEDZ
                    </label>
                    <div class="dialog-actions">
                        <button class="dialog-cancel" id="btnCancelEdit" type="button">ANULUJ</button>
                        <button class="add-btn" type="submit">ZAPISZ</button>
                    </div>
                    <p class="form-message" id="editMessage" role="status" aria-live="polite"></p>
                </form>
            </dialog>
            <dialog class="settings-dialog" id="settingsDialog">
                <form id="settingsForm">
                    <h2>Ustawienia</h2>
                    <label for="uiScale">Rozmiar interfejsu</label>
                    <div class="scale-control">
                        <span aria-hidden="true">A</span>
                        <input id="uiScale" type="range" min="75" max="125" step="5" value="100">
                        <span class="scale-large" aria-hidden="true">A</span>
                    </div>
                    <output id="uiScaleValue" for="uiScale">100%</output>
                    <div class="dialog-actions">
                        <button class="dialog-cancel" id="btnCancelSettings" type="button">ANULUJ</button>
                        <button class="add-btn" type="submit">ZAPISZ</button>
                    </div>
                </form>
            </dialog>
        </main>

        <nav class="actions">
            <button id="btnStart" class="action-btn" type="button">ZACZNIJ OD NOWA</button>
            <button id="btnBack" class="action-btn" type="button">COFNIJ</button>
            <button id="btnDelete" class="action-btn" type="button">USUŃ</button>
            <button id="btnSettings" class="action-btn settings" type="button" aria-label="Ustawienia" title="Ustawienia">⚙<span>USTAWIENIA</span></button>
            <button id="btnSpeak" class="action-btn speak" type="button">POWIEDZ</button>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js?v=10"></script>
    <script>
        if ("serviceWorker" in navigator) {
            window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
        }
    </script>
</body>
</html>
