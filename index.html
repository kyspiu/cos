<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Komunikator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <div class="speech-display" id="speechDisplay" aria-live="polite">—</div>
            <div class="category-path" id="categoryPath">Kategorie główne</div>
        </header>

        <main>
            <div class="grid" id="grid"></div>
            <dialog class="category-dialog" id="categoryDialog">
                <form id="categoryForm">
                    <h2>Nowa kategoria</h2>
                    <label>
                        Nazwa
                        <input id="categoryName" type="text" maxlength="32" placeholder="np. JEDZENIE" required>
                    </label>
                    <label>
                        Emoji
                        <input id="categoryEmoji" type="text" maxlength="4" placeholder="📁">
                    </label>
                    <label>
                        Kolor
                        <input id="categoryColor" type="color" value="#0ea5e9">
                    </label>
                    <div class="dialog-actions">
                        <button class="dialog-cancel" id="btnCancelCategory" type="button">ANULUJ</button>
                        <button class="add-btn" type="submit">DODAJ</button>
                    </div>
                    <p class="form-message" id="categoryMessage" role="status" aria-live="polite"></p>
                </form>
            </dialog>
        </main>

        <nav class="actions">
            <button id="btnStart" class="action-btn" type="button">START</button>
            <button id="btnBack" class="action-btn" type="button">COFNIJ</button>
            <button id="btnDelete" class="action-btn" type="button">USUŃ</button>
            <button id="btnClear" class="action-btn" type="button">WYCZYŚĆ</button>
            <button id="btnSpeak" class="action-btn speak" type="button">POWIEDZ</button>
        </nav>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
</body>
</html>
